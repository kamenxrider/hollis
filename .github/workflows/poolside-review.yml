name: Poolside code review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: poolside-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only the protected default branch is trusted. Forks are rejected before
    # the Poolside secret is exposed, and drafts wait until they are ready.
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out trusted review code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-source

      - name: Fetch the validated pull request diff
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTPUT_DIR: ${{ runner.temp }}/poolside-review
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_REPOSITORY: ${{ github.repository }}
        run: |
          python3 trusted-source/scripts/poolside-review/poolside_review.py fetch-diff \
            --repository "$REVIEW_REPOSITORY" \
            --pull-request "$REVIEW_PR_NUMBER" \
            --base-sha "$REVIEW_BASE_SHA" \
            --head-sha "$REVIEW_HEAD_SHA" \
            --output "$REVIEW_OUTPUT_DIR/diff.json"

      - name: Request a text-only Poolside review
        env:
          POOLSIDE_API_KEY: ${{ secrets.POOLSIDE_API_KEY }}
          REVIEW_OUTPUT_DIR: ${{ runner.temp }}/poolside-review
        run: |
          python3 trusted-source/scripts/poolside-review/poolside_review.py create-review \
            --input "$REVIEW_OUTPUT_DIR/diff.json" \
            --output "$REVIEW_OUTPUT_DIR/review.json"

      - name: Upload the bounded review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poolside-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/poolside-review/review.json
          if-no-files-found: error
          retention-days: 1

  post:
    needs: review
    if: >-
      needs.review.result == 'success' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Download the review artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: poolside-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/poolside-review-artifact

      - name: Validate the artifact as inert data
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          REVIEW_ARTIFACT_DIR: ${{ runner.temp }}/poolside-review-artifact
          REVIEW_REQUEST_DIR: ${{ runner.temp }}/poolside-review-post
        run: |
          set -eu
          test -f "$REVIEW_ARTIFACT_DIR/review.json"
          test ! -L "$REVIEW_ARTIFACT_DIR/review.json"
          test "$(find "$REVIEW_ARTIFACT_DIR" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test "$(stat -c %s "$REVIEW_ARTIFACT_DIR/review.json")" -le 364096
          /usr/bin/jq -e \
            --arg repository "$EXPECTED_REPOSITORY" \
            --arg pr "$EXPECTED_PR_NUMBER" \
            --arg base "$EXPECTED_BASE_SHA" \
            --arg head "$EXPECTED_HEAD_SHA" \
            'type == "object" and
             keys == ["base_sha", "head_sha", "pull_request", "repository", "review_markdown", "schema_version"] and
             .schema_version == 1 and
             .repository == $repository and
             .pull_request == ($pr | tonumber) and
             .base_sha == $base and .head_sha == $head and
             (.base_sha | test("^[0-9a-f]{40}$")) and
             (.head_sha | test("^[0-9a-f]{40}$")) and
             (.review_markdown | type == "string") and
             (.review_markdown | utf8bytelength > 0 and utf8bytelength <= 60000)' \
            "$REVIEW_ARTIFACT_DIR/review.json" >/dev/null
          mkdir -p "$REVIEW_REQUEST_DIR"
          /usr/bin/jq '{body: .review_markdown}' \
            "$REVIEW_ARTIFACT_DIR/review.json" >"$REVIEW_REQUEST_DIR/request.json"

      - name: Post the review comment
        env:
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_REQUEST: ${{ runner.temp }}/poolside-review-post/request.json
        run: |
          /usr/bin/gh api --silent --method POST \
            "repos/$EXPECTED_REPOSITORY/issues/$EXPECTED_PR_NUMBER/comments" \
            --input "$REVIEW_REQUEST"
