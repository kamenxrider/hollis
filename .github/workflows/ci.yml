name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Prepare image harness environment
        run: |
          python3 -m venv "$RUNNER_TEMP/hollis-image-suite-venv"
          "$RUNNER_TEMP/hollis-image-suite-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            -r scripts/image-suite/requirements.txt

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Poolside review boundary tests
        run: python3 -m unittest discover -s scripts/poolside-review -p 'test_*.py'

      - name: Image bridge and packaging tests
        run: python3 -m unittest discover -s scripts/image-install-check -p 'test_*.py'

      - name: Portable plugin and installer tests (no model calls)
        run: |
          python3 -m unittest discover -s scripts/plugin -p 'test_*.py'
          python3 scripts/plugin/package_plugin.py --validate-only
          for script in plugins/hollis/scripts/*.sh; do bash -n "$script"; done

      - name: Image harness tests (no model calls)
        run: '"$RUNNER_TEMP/hollis-image-suite-venv/bin/python" -m unittest discover -s scripts/image-suite -p "test_*.py"'

      - name: Host matrix journal and pacing tests (no model calls)
        run: python3 -m unittest discover -s scripts/live-suite -p 'test_host_matrix.py'

      # Bridge generation needs no Shortcuts on the runner: this catches
      # profile regressions (file sets, WFLLMModel strings, client
      # versions) before a user ever runs make-bridge.py. Files are
      # counted in Python — parsing `ls` breaks on `wc -l` padding and
      # ls aliases/replacements alike.
      - name: Bridge generator (27 profile)
        run: |
          python3 scripts/make-bridge.py --os 27 "$RUNNER_TEMP/bridges27"
          python3 scripts/count_bridges.py "$RUNNER_TEMP/bridges27" 4

      - name: Bridge generator (26 profile)
        run: |
          python3 scripts/make-bridge.py --os 26 "$RUNNER_TEMP/bridges26"
          python3 scripts/count_bridges.py "$RUNNER_TEMP/bridges26" 3
          ! grep -q "Apple Intelligence Pro" "$RUNNER_TEMP/bridges26"/*.shortcut
