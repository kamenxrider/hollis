name: Plugin package

on:
  workflow_dispatch:
  push:
    tags: ["plugin-v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate and test
        run: |
          python3 -m unittest discover -s scripts/plugin -p 'test_*.py'
          python3 scripts/plugin/package_plugin.py --validate-only
          python3 scripts/release/privacy.py --source
          git archive --format=tar HEAD > "$RUNNER_TEMP/hollis-source.tar"
          python3 scripts/release/privacy.py --archive "$RUNNER_TEMP/hollis-source.tar" --kind source
          for script in plugins/hollis/scripts/*.sh; do bash -n "$script"; done
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION=$(python3 -c 'import json; print(json.load(open("plugins/hollis/plugin.json"))["version"])')
            [[ "$GITHUB_REF_NAME" == "plugin-v$VERSION" ]]
          fi

      - name: Verify runtime provenance and package both hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/plugin/package_plugin.py --output dist/plugin
          for archive in dist/plugin/*.zip; do
            python3 scripts/release/privacy.py --archive "$archive" --kind plugin
          done
          python3 scripts/release/privacy.py --release-dir dist/plugin --kind plugin

      - name: Attest plugin archive and release evidence
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/plugin/*

      - name: Retain review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hollis-plugin
          path: dist/plugin/*
          if-no-files-found: error

      - name: Publish separately authorized plugin tag
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --latest=false \
            --title "Hollis plugin ${GITHUB_REF_NAME#plugin-}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            dist/plugin/*
