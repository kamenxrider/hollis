name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Poolside review boundary tests
        run: python3 -m unittest discover -s scripts/poolside-review -p 'test_*.py'

      - name: Image bridge and packaging tests
        run: python3 -m unittest discover -s scripts/image-install-check -p 'test_*.py'

      - name: Portable plugin and installer tests (no model calls)
        run: |
          python3 -m unittest discover -s scripts/plugin -p 'test_*.py'
          python3 scripts/plugin/package_plugin.py --validate-only
          for script in plugins/hollis/scripts/*.sh; do bash -n "$script"; done

      - name: Publication privacy checks
        run: |
          python3 scripts/release/privacy.py --source
          git archive --format=tar HEAD > "$RUNNER_TEMP/hollis-source.tar"
          python3 scripts/release/privacy.py --archive "$RUNNER_TEMP/hollis-source.tar" --kind source
          python3 -m unittest discover -s scripts/release -p 'test_*.py'

      # Bridge generation needs no Shortcuts on the runner: this catches
      # profile regressions (file sets, WFLLMModel strings, client
      # versions) before a user ever runs make-bridge.py. Files are
      # counted in Python — parsing `ls` breaks on `wc -l` padding and
      # ls aliases/replacements alike.
      - name: Bridge generator (27 profile)
        run: |
          python3 scripts/make-bridge.py --os 27 "$RUNNER_TEMP/bridges27"
          python3 scripts/count_bridges.py "$RUNNER_TEMP/bridges27" 4

      - name: Bridge generator (26 profile)
        run: |
          python3 scripts/make-bridge.py --os 26 "$RUNNER_TEMP/bridges26"
          python3 scripts/count_bridges.py "$RUNNER_TEMP/bridges26" 3
          ! grep -q "Apple Intelligence Pro" "$RUNNER_TEMP/bridges26"/*.shortcut

  native-package:
    # This preview image supplies SDK 27 while its host still runs macOS 26.
    # Compile and inspect the helper here; real inference is qualified on macOS 27.
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check reviewed publication inputs
        run: |
          python3 scripts/release/privacy.py --source
          git archive --format=tar HEAD > "$RUNNER_TEMP/hollis-source.tar"
          python3 scripts/release/privacy.py --archive "$RUNNER_TEMP/hollis-source.tar" --kind source
      - name: Build and inspect native runtime package without publication
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          test "${SDK%%.*}" -ge 27
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags '-s -w -X github.com/kamenxrider/hollis/internal/cli.version=0.4.0' -o dist/hollis-darwin-arm64 ./cmd/hollis
          bash scripts/build-native.sh dist/hollis-native-darwin-arm64
          python3 scripts/package-bridges.py dist
          python3 scripts/plugin/package_runtime.py dist --version 0.4.0
          python3 scripts/release/privacy.py --archive dist/hollis-0.4.0-darwin-arm64.zip --kind bundle
          python3 scripts/release/privacy.py --archive dist/hollis-bridges.zip --kind bridges
