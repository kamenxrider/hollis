name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Bridge generation needs no Shortcuts on the runner: this catches
      # profile regressions (file sets, WFLLMModel strings, client
      # versions) before a user ever runs make-bridge.py. Files are
      # counted in Python — parsing `ls` breaks on `wc -l` padding and
      # ls aliases/replacements alike.
      - name: Bridge generator (27 profile)
        run: |
          python3 scripts/make-bridge.py --os 27 "$RUNNER_TEMP/bridges27"
          python3 scripts/count_bridges.py "$RUNNER_TEMP/bridges27" 4

      - name: Bridge generator (26 profile)
        run: |
          python3 scripts/make-bridge.py --os 26 "$RUNNER_TEMP/bridges26"
          python3 scripts/count_bridges.py "$RUNNER_TEMP/bridges26" 3
          ! grep -q "Apple Intelligence Pro" "$RUNNER_TEMP/bridges26"/*.shortcut
